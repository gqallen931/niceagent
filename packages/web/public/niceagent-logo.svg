<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="NiceAgent">
  <defs>
    <linearGradient id="na-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="0.55" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#na-bg)" />
  <!-- The N: two uprights joined by a diagonal, drawn as one stroked path. -->
  <path d="M40 92V36l48 56V36" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  <!-- The agent node: the loop closes on the right upright. -->
  <circle cx="88" cy="36" r="10" fill="#ffffff" />
  <circle cx="88" cy="36" r="4" fill="#6366f1" />
</svg>
